name: Scrape Credit Cards

on:
  workflow_dispatch:
    inputs:
      connector_id:
        description: 'Connector ID to scrape (fetches credentials from DB at runtime)'
        required: true
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scraper/package.json

      - name: Install dependencies
        working-directory: scraper
        run: npm install

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libc6 \
            libcairo2 \
            libcups2 \
            libdbus-1-3 \
            libexpat1 \
            libfontconfig1 \
            libgbm1 \
            libgcc1 \
            libglib2.0-0 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libstdc++6 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxcomposite1 \
            libxcursor1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxrandr2 \
            libxrender1 \
            libxss1 \
            libxtst6

      - name: Run scraper
        working-directory: scraper
        env:
          WEALTH_OS_API_URL: ${{ secrets.WEALTH_OS_API_URL }}
          SCRAPER_SECRET:    ${{ secrets.SCRAPER_SECRET }}
          PORTFOLIO_ID:      ${{ secrets.PORTFOLIO_ID }}
          CONNECTOR_ID:      ${{ inputs.connector_id }}
          # Credentials are fetched from the DB via the credentials endpoint at runtime.
          # No card-company secrets needed here anymore.
        run: npm run scrape
